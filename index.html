<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ed">
<title>☕ 咖啡钱包</title>
<style>
  :root{--bg:#f7f3ed;--card:#fffdf9;--text:#302d29;--muted:#8a8177;--line:#e9e1d7;--accent:#6f6257}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif}
  main{max-width:520px;margin:auto;padding:32px 20px 44px}
  h1{font-size:26px;margin:0 0 6px;font-weight:700}
  .month{color:var(--muted);font-size:14px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 5px 20px rgba(70,55,40,.05)}
  .label{font-size:14px;color:var(--muted)}
  .remaining{font-size:48px;font-weight:750;letter-spacing:-1px;margin:6px 0 8px}
  .summary{font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
  .bar{height:8px;background:var(--line);border-radius:99px;margin:20px 0 22px;overflow:hidden}
  .bar>div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:.25s}
  button{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer}
  .primary{width:100%;background:var(--accent);color:white}
  .secondary{background:#eee8e0;color:var(--text)}
  .danger{background:transparent;color:#a36d62;font-size:14px;padding:8px}
  .section{margin-top:30px}
  .section-title{font-size:16px;font-weight:700;margin-bottom:12px}
  .empty{color:var(--muted);font-size:14px;padding:16px 0}
  .item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .date{font-size:14px}.time{font-size:12px;color:var(--muted);margin-top:3px}
  .amount{font-size:16px;font-weight:650;margin-right:8px}
  .row{display:flex;align-items:center}
  .settings{margin-top:18px;text-align:center}
  .settings button{font-size:13px;color:var(--muted);background:transparent;padding:8px}
  dialog{border:0;border-radius:20px;padding:0;width:min(92vw,380px);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.2)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .modal{padding:24px}
  .modal h2{font-size:20px;margin:0 0 18px}
  input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:18px;background:white;color:var(--text);outline:none}
  .actions{display:flex;gap:10px;margin-top:16px}
  .actions button{flex:1}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>☕ 咖啡钱包</h1>
  <div class="month" id="month"></div>

  <section class="card">
    <div class="label">本月剩余</div>
    <div class="remaining" id="remaining">¥300</div>
    <div class="summary">
      <span id="spent">已用 ¥0</span>
      <span id="budget">额度 ¥300</span>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <button class="primary" id="addBtn">＋ 记录一杯咖啡</button>
  </section>

  <section class="section">
    <div class="section-title">本月记录</div>
    <div id="list"></div>
  </section>

  <div class="settings">
    <button id="budgetBtn">修改本月额度</button>
    <button id="resetBtn">清空本月记录</button>
  </div>
</main>

<dialog id="addDialog">
  <div class="modal">
    <h2>喝了多少钱？</h2>
    <input id="amountInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如 28">
    <div style="height:10px"></div>
    <input id="dateInput" type="date">
    <div class="actions">
      <button class="secondary" id="cancelAdd">取消</button>
      <button class="primary" id="saveAdd">记一笔</button>
    </div>
  </div>
</dialog>

<dialog id="budgetDialog">
  <div class="modal">
    <h2>本月咖啡额度</h2>
    <input id="budgetInput" type="number" inputmode="decimal" min="0" step="1" placeholder="300">
    <div class="actions">
      <button class="secondary" id="cancelBudget">取消</button>
      <button class="primary" id="saveBudget">保存</button>
    </div>
    <div class="note">额度只影响本月。下个月会自动使用默认额度 ¥300，除非你再次修改。</div>
  </div>
</dialog>

<script>
const DEFAULT_BUDGET = 300;
const KEY = "coffee-wallet-v1";

function monthKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function load(){
  let data;
  try{data=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(!data || data.month!==monthKey()){
    data={month:monthKey(), budget:DEFAULT_BUDGET, records:[]};
    save(data);
  }
  return data;
}
function save(data){localStorage.setItem(KEY,JSON.stringify(data))}
let data=load();

const money=n=>"¥"+Number(n).toFixed(2).replace(/\.00$/,"");
function render(){
  const d=new Date();
  document.getElementById("month").textContent=`${d.getFullYear()}年${d.getMonth()+1}月`;
  const spent=data.records.reduce((s,r)=>s+r.amount,0);
  const remaining=data.budget-spent;
  document.getElementById("remaining").textContent=money(remaining);
  document.getElementById("spent").textContent=`已用 ${money(spent)}`;
  document.getElementById("budget").textContent=`额度 ${money(data.budget)}`;
  document.getElementById("bar").style.width=Math.min(100,Math.max(0,spent/data.budget*100))+"%";

  const list=document.getElementById("list");
  if(!data.records.length){
    list.innerHTML='<div class="empty">还没有记录。今天不用喝也没关系 ☺️</div>';
    return;
  }
  list.innerHTML=data.records.slice().reverse().map((r,i)=>{
    const realIndex=data.records.length-1-i;
    const dt=new Date(r.time);
    const date=`${dt.getMonth()+1}月${dt.getDate()}日`;
    const time=`${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
    return `<div class="item">
      <div><div class="date">${date}</div><div class="time">${time}</div></div>
      <div class="row"><span class="amount">−${money(r.amount)}</span><button class="danger" data-index="${realIndex}">撤销</button></div>
    </div>`;
  }).join("");
  list.querySelectorAll(".danger").forEach(btn=>{
    btn.onclick=()=>{
      data.records.splice(Number(btn.dataset.index),1); save(data); render();
    };
  });
}
render();

const addDialog=document.getElementById("addDialog");
document.getElementById("addBtn").onclick=()=>{
  document.getElementById("amountInput").value="";
  const today = new Date();
  const localDate = new Date(today.getTime() - today.getTimezoneOffset()*60000).toISOString().slice(0,10);
  document.getElementById("dateInput").value=localDate;
  addDialog.showModal();
  setTimeout(()=>document.getElementById("amountInput").focus(),50);
};
document.getElementById("cancelAdd").onclick=()=>addDialog.close();
document.getElementById("saveAdd").onclick=()=>{
  const amount=Number(document.getElementById("amountInput").value);
  const date=document.getElementById("dateInput").value;
  if(!(amount>0) || !date) return;
  const now=new Date();
  const [y,m,day]=date.split("-").map(Number);
  const chosen=new Date(y,m-1,day,now.getHours(),now.getMinutes(),now.getSeconds());
  data.records.push({amount,time:chosen.toISOString()});
  save(data); render(); addDialog.close();
};
document.getElementById("amountInput").addEventListener("keydown",e=>{
  if(e.key==="Enter")document.getElementById("saveAdd").click();
});

const budgetDialog=document.getElementById("budgetDialog");
document.getElementById("budgetBtn").onclick=()=>{
  document.getElementById("budgetInput").value=data.budget;
  budgetDialog.showModal();
  setTimeout(()=>document.getElementById("budgetInput").focus(),50);
};
document.getElementById("cancelBudget").onclick=()=>budgetDialog.close();
document.getElementById("saveBudget").onclick=()=>{
  const n=Number(document.getElementById("budgetInput").value);
  if(!(n>=0)) return;
  data.budget=n; save(data); render(); budgetDialog.close();
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("确定清空本月所有咖啡记录吗？")){
    data.records=[]; save(data); render();
  }
};
</script>
</body>
</html>
